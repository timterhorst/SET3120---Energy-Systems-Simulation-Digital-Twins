      temperature: 10  # Koud
      outside_temperature: 0  # Zeer koud (grote warmteverlies)
      thermal_capacitance: 1000  # KLEIN (snelle dynamiek)
      thermal_resistance: 0.005  # SLECHT geïsoleerd (grote warmteverlies)
      